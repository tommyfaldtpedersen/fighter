<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #fff;
            background-color: #000;
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Scale helper - converts relative values to actual pixels
        const scale = {
            x: (relativeValue) => canvas.width * relativeValue,
            y: (relativeValue) => canvas.height * relativeValue,
            size: (relativeValue) => Math.min(canvas.width, canvas.height) * relativeValue
        };

        // Player spaceship with physics
        const player = {
            x: 0.5,           // Center position
            y: 0.5,
            velocityX: 0,     // Velocity in x direction
            velocityY: 0,     // Velocity in y direction
            rotation: 0,      // Angle in radians (0 = pointing right)
            size: 0.03,       // Size relative to canvas
            color: '#00ff00',
            acceleration: 0.0002,  // Acceleration rate
            rotationSpeed: 0.08,   // Rotation speed
            friction: 0.98,        // Friction/drag (0.98 = 2% speed loss per frame)
            brakeForce: 0.95       // Braking strength
        };

        // Keyboard state
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };

        // Other game objects
        const gameObjects = {
            enemy: {
                x: 0.7,
                y: 0.3,
                width: 0.08,
                height: 0.12,
                color: '#ff0000'
            },
            ground: {
                x: 0,
                y: 0.8,      // 80% down from top
                width: 1,     // Full width
                height: 0.2,  // 20% of canvas height
                color: '#8B4513'
            }
        };

        // Resize canvas to fit viewport while maintaining aspect ratio
        function resizeCanvas() {
            const aspectRatio = 4 / 3; // Change this to your preferred ratio (16/9, 4/3, etc.)
            const maxWidth = window.innerWidth - 20; // 20px padding
            const maxHeight = window.innerHeight - 20;

            let width = maxWidth;
            let height = width / aspectRatio;

            // If height is too large, scale based on height instead
            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }

            // Set canvas resolution (actual pixels)
            canvas.width = width;
            canvas.height = height;

            // Redraw your game here after resize
            draw();
        }

        // Drawing function
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw other game objects
            for (const [name, obj] of Object.entries(gameObjects)) {
                ctx.fillStyle = obj.color;
                ctx.fillRect(
                    scale.x(obj.x),
                    scale.y(obj.y),
                    scale.x(obj.width),
                    scale.y(obj.height)
                );
            }

            // Draw player spaceship as a triangle
            drawSpaceship();
        }

        // Draw spaceship (triangle pointing in rotation direction)
        function drawSpaceship() {
            const x = scale.x(player.x);
            const y = scale.y(player.y);
            const size = scale.size(player.size);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(player.rotation);

            // Draw triangle (spaceship)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(size, 0);           // Front point
            ctx.lineTo(-size, size);       // Bottom back
            ctx.lineTo(-size, -size);      // Top back
            ctx.closePath();
            ctx.fill();

            // Draw thrust flame when accelerating
            if (keys.ArrowUp) {
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-size, size * 0.5);
                ctx.lineTo(-size * 1.5, 0);
                ctx.lineTo(-size, -size * 0.5);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        // Update player physics
        function updatePlayer() {
            // Rotation
            if (keys.ArrowLeft) {
                player.rotation -= player.rotationSpeed;
            }
            if (keys.ArrowRight) {
                player.rotation += player.rotationSpeed;
            }

            // Acceleration (forward in pointing direction)
            if (keys.ArrowUp) {
                player.velocityX += Math.cos(player.rotation) * player.acceleration;
                player.velocityY += Math.sin(player.rotation) * player.acceleration;
            }

            // Braking
            if (keys.ArrowDown) {
                player.velocityX *= player.brakeForce;
                player.velocityY *= player.brakeForce;
            }

            // Apply friction
            player.velocityX *= player.friction;
            player.velocityY *= player.friction;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Wrap around screen edges
            if (player.x < 0) player.x = 1;
            if (player.x > 1) player.x = 0;
            if (player.y < 0) player.y = 1;
            if (player.y > 1) player.y = 0;
        }

        // Keyboard event listeners
        window.addEventListener('keydown', (e) => {
            if (e.key in keys) {
                keys[e.key] = true;
                e.preventDefault(); // Prevent page scrolling
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in keys) {
                keys[e.key] = false;
                e.preventDefault();
            }
        });

        // Initial resize
        resizeCanvas();

        // Resize canvas when window size changes
        window.addEventListener('resize', resizeCanvas);

        // Game loop
        function gameLoop() {
            updatePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game loop
        gameLoop();
    </script>
</body>

</html>
