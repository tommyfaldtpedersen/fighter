<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #fff;
            background-color: #000;
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Scale helper - converts relative values to actual pixels
        const scale = {
            x: (relativeValue) => canvas.width * relativeValue,
            y: (relativeValue) => canvas.height * relativeValue,
            size: (relativeValue) => Math.min(canvas.width, canvas.height) * relativeValue
        };

        // Player spaceship with physics
        const player = {
            x: 0.5,           // Center position
            y: 0.5,
            velocityX: 0,     // Velocity in x direction
            velocityY: 0,     // Velocity in y direction
            rotation: 0,      // Angle in radians (0 = pointing right)
            size: 0.03,       // Size relative to canvas
            color: '#00ff00',
            acceleration: 0.0002,  // Acceleration rate
            rotationSpeed: 0.08,   // Rotation speed
            friction: 0.98,        // Friction/drag (0.98 = 2% speed loss per frame)
            brakeForce: 0.95       // Braking strength
        };

        // Keyboard state
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            ' ': false  // Space key
        };

        // Projectiles array
        const projectiles = [];
        let canShoot = true;  // Shooting cooldown flag

        // Asteroids
        const asteroids = [
            {
                x: 0.3,
                y: 0.2,
                velocityX: 0.0005,
                velocityY: 0.0003,
                size: 0.06,
                color: '#888888'
            },
            {
                x: 0.7,
                y: 0.6,
                velocityX: -0.0003,
                velocityY: 0.0004,
                size: 0.06,  // Same size as first asteroid
                color: '#999999'
            }
        ];

        // Game state
        let gameOver = false;
        let lives = 3;
        let score = 0;
        let invincible = false;  // Temporary invincibility after being hit
        let invincibleTimer = 0;

        // Other game objects
        const gameObjects = {
            enemy: {
                x: 0.7,
                y: 0.3,
                width: 0.08,
                height: 0.12,
                color: '#ff0000'
            },
            ground: {
                x: 0,
                y: 0.8,      // 80% down from top
                width: 1,     // Full width
                height: 0.2,  // 20% of canvas height
                color: '#8B4513'
            }
        };

        // Resize canvas to fit viewport while maintaining aspect ratio
        function resizeCanvas() {
            const aspectRatio = 4 / 3; // Change this to your preferred ratio (16/9, 4/3, etc.)
            const maxWidth = window.innerWidth - 20; // 20px padding
            const maxHeight = window.innerHeight - 20;

            let width = maxWidth;
            let height = width / aspectRatio;

            // If height is too large, scale based on height instead
            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }

            // Set canvas resolution (actual pixels)
            canvas.width = width;
            canvas.height = height;

            // Redraw your game here after resize
            draw();
        }

        // Drawing function
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw other game objects
            for (const [name, obj] of Object.entries(gameObjects)) {
                ctx.fillStyle = obj.color;
                ctx.fillRect(
                    scale.x(obj.x),
                    scale.y(obj.y),
                    scale.x(obj.width),
                    scale.y(obj.height)
                );
            }

            // Draw asteroids
            drawAsteroids();

            // Draw projectiles
            drawProjectiles();

            // Draw lives indicator
            drawLives();

            // Draw score
            drawScore();

            // Draw player spaceship as a triangle
            if (!gameOver) {
                drawSpaceship();
            } else {
                // Draw explosion effect
                drawExplosion();
            }
        }

        // Draw spaceship (triangle pointing in rotation direction)
        function drawSpaceship() {
            // Blink effect when invincible
            if (invincible && Math.floor(Date.now() / 100) % 2 === 0) {
                return;  // Don't draw ship every other 100ms
            }

            const x = scale.x(player.x);
            const y = scale.y(player.y);
            const size = scale.size(player.size);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(player.rotation);

            // Draw triangle (spaceship)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(size, 0);           // Front point
            ctx.lineTo(-size, size);       // Bottom back
            ctx.lineTo(-size, -size);      // Top back
            ctx.closePath();
            ctx.fill();

            // Draw thrust flame when accelerating
            if (keys.ArrowUp) {
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-size, size * 0.5);
                ctx.lineTo(-size * 1.5, 0);
                ctx.lineTo(-size, -size * 0.5);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        // Draw lives indicator in upper left corner
        function drawLives() {
            const startX = scale.size(0.03);
            const startY = scale.size(0.03);
            const shipSize = scale.size(0.015);
            const spacing = scale.size(0.04);

            for (let i = 0; i < lives; i++) {
                const x = startX + (i * spacing);
                const y = startY;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(-Math.PI / 2);  // Point upward

                // Draw small spaceship icon
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.moveTo(shipSize, 0);
                ctx.lineTo(-shipSize, shipSize);
                ctx.lineTo(-shipSize, -shipSize);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // Draw score in upper right corner
        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.font = scale.size(0.04) + 'px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('Score: ' + score, canvas.width - scale.size(0.03), scale.size(0.04));
        }

        // Draw asteroids
        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.fillStyle = asteroid.color;
                ctx.beginPath();
                ctx.arc(
                    scale.x(asteroid.x),
                    scale.y(asteroid.y),
                    scale.size(asteroid.size),
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Add texture to asteroids
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // Draw explosion effect
        function drawExplosion() {
            const x = scale.x(player.x);
            const y = scale.y(player.y);
            const size = scale.size(player.size);

            ctx.fillStyle = '#ff6600';
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                ctx.beginPath();
                ctx.arc(
                    x + Math.cos(angle) * size * 2,
                    y + Math.sin(angle) * size * 2,
                    size * 0.5,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            // Game over text
            ctx.fillStyle = '#ffffff';
            ctx.font = scale.size(0.05) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 + scale.size(0.1));
            ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + scale.size(0.15));
        }

        // Draw projectiles
        function drawProjectiles() {
            ctx.fillStyle = '#ffff00';
            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(
                    scale.x(proj.x),
                    scale.y(proj.y),
                    scale.size(0.005),  // Small bullet size
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });
        }

        // Shoot projectile
        function shoot() {
            if (!canShoot) return;

            const projectileSpeed = 0.008;  // Speed of projectile
            projectiles.push({
                x: player.x,
                y: player.y,
                velocityX: Math.cos(player.rotation) * projectileSpeed,
                velocityY: Math.sin(player.rotation) * projectileSpeed,
                lifetime: 0  // Track how long projectile has existed
            });

            // Cooldown to prevent holding space from creating too many projectiles
            canShoot = false;
            setTimeout(() => canShoot = true, 200);  // 200ms cooldown
        }

        // Update projectiles
        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];

                // Update position
                proj.x += proj.velocityX;
                proj.y += proj.velocityY;
                proj.lifetime++;

                // Check collision with asteroids
                let hitAsteroid = false;
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = proj.x - asteroid.x;
                    const dy = proj.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < asteroid.size) {
                        hitAsteroid = true;

                        // Award points based on asteroid size
                        if (asteroid.size >= 0.06) {
                            score += 100;  // Large asteroid
                        } else if (asteroid.size >= 0.03) {
                            score += 50;   // Medium asteroid
                        } else {
                            score += 25;   // Small asteroid
                        }

                        // Split asteroid if it's large enough
                        if (asteroid.size > 0.02) {
                            const newSize = asteroid.size / 2;
                            const speed = Math.sqrt(asteroid.velocityX ** 2 + asteroid.velocityY ** 2) * 2;

                            // Create two new asteroids with random directions
                            for (let k = 0; k < 2; k++) {
                                const angle = Math.random() * Math.PI * 2;
                                asteroids.push({
                                    x: asteroid.x,
                                    y: asteroid.y,
                                    velocityX: Math.cos(angle) * speed,
                                    velocityY: Math.sin(angle) * speed,
                                    size: newSize,
                                    color: asteroid.color
                                });
                            }
                        }

                        // Remove the hit asteroid
                        asteroids.splice(j, 1);
                        break;
                    }
                }

                // Remove projectile if it hit something or went off screen
                if (hitAsteroid || proj.x < 0 || proj.x > 1 || proj.y < 0 || proj.y > 1 || proj.lifetime > 180) {
                    projectiles.splice(i, 1);
                }
            }
        }

        // Update asteroids
        function updateAsteroids() {
            asteroids.forEach(asteroid => {
                // Update position
                asteroid.x += asteroid.velocityX;
                asteroid.y += asteroid.velocityY;

                // Wrap around screen edges
                if (asteroid.x < -asteroid.size) asteroid.x = 1 + asteroid.size;
                if (asteroid.x > 1 + asteroid.size) asteroid.x = -asteroid.size;
                if (asteroid.y < -asteroid.size) asteroid.y = 1 + asteroid.size;
                if (asteroid.y > 1 + asteroid.size) asteroid.y = -asteroid.size;
            });
        }

        // Check collision between player and asteroids
        function checkCollisions() {
            if (gameOver || invincible) return;

            asteroids.forEach(asteroid => {
                const dx = player.x - asteroid.x;
                const dy = player.y - asteroid.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Check if collision occurred
                if (distance < player.size + asteroid.size) {
                    lives--;

                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        // Respawn player with temporary invincibility
                        respawnPlayer();
                    }
                }
            });
        }

        // Respawn player at center with invincibility
        function respawnPlayer() {
            player.x = 0.5;
            player.y = 0.5;
            player.velocityX = 0;
            player.velocityY = 0;
            player.rotation = 0;
            invincible = true;
            invincibleTimer = 180;  // 3 seconds of invincibility at 60fps
        }

        // Reset game
        function resetGame() {
            player.x = 0.5;
            player.y = 0.5;
            player.velocityX = 0;
            player.velocityY = 0;
            player.rotation = 0;
            gameOver = false;
            lives = 3;
            score = 0;
            invincible = false;
            invincibleTimer = 0;
            projectiles.length = 0;

            // Reset asteroids to original state
            asteroids.length = 0;
            asteroids.push(
                {
                    x: 0.3,
                    y: 0.2,
                    velocityX: 0.0005,
                    velocityY: 0.0003,
                    size: 0.06,
                    color: '#888888'
                },
                {
                    x: 0.7,
                    y: 0.6,
                    velocityX: -0.0003,
                    velocityY: 0.0004,
                    size: 0.06,
                    color: '#999999'
                }
            );
        }

        // Update player physics
        function updatePlayer() {
            if (gameOver) return;

            // Update invincibility timer
            if (invincible) {
                invincibleTimer--;
                if (invincibleTimer <= 0) {
                    invincible = false;
                }
            }

            // Shooting
            if (keys[' ']) {
                shoot();
            }

            // Rotation
            if (keys.ArrowLeft) {
                player.rotation -= player.rotationSpeed;
            }
            if (keys.ArrowRight) {
                player.rotation += player.rotationSpeed;
            }

            // Acceleration (forward in pointing direction)
            if (keys.ArrowUp) {
                player.velocityX += Math.cos(player.rotation) * player.acceleration;
                player.velocityY += Math.sin(player.rotation) * player.acceleration;
            }

            // Braking
            if (keys.ArrowDown) {
                player.velocityX *= player.brakeForce;
                player.velocityY *= player.brakeForce;
            }

            // Apply friction
            player.velocityX *= player.friction;
            player.velocityY *= player.friction;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Wrap around screen edges
            if (player.x < 0) player.x = 1;
            if (player.x > 1) player.x = 0;
            if (player.y < 0) player.y = 1;
            if (player.y > 1) player.y = 0;
        }

        // Keyboard event listeners
        window.addEventListener('keydown', (e) => {
            if (e.key in keys) {
                keys[e.key] = true;
                e.preventDefault(); // Prevent page scrolling
            }
            // Handle space key specifically
            if (e.key === ' ' || e.code === 'Space') {
                keys[' '] = true;
                e.preventDefault();
            }
            // Restart game with R key
            if (e.key === 'r' || e.key === 'R') {
                if (gameOver) resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in keys) {
                keys[e.key] = false;
                e.preventDefault();
            }
            // Handle space key specifically
            if (e.key === ' ' || e.code === 'Space') {
                keys[' '] = false;
                e.preventDefault();
            }
        });

        // Initial resize
        resizeCanvas();

        // Resize canvas when window size changes
        window.addEventListener('resize', resizeCanvas);

        // Game loop
        function gameLoop() {
            updatePlayer();
            updateProjectiles();
            updateAsteroids();
            checkCollisions();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game loop
        gameLoop();
    </script>
</body>

</html>
