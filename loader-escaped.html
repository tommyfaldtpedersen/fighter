<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Verus Blaster...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        #loader {
            text-align: center;
            color: #fff;
        }

        #progress {
            font-size: 20px;
            margin-bottom: 20px;
        }

        #game-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div id="progress">Loading game... <span id="percent">0</span>%</div>
    </div>
    <div id="game-container"></div>

    <script>
        async function loadGame() {
            try {
                // Fetch the JSON file with individual chunks
                const response = await fetch('game-chunks.json');
                const chunksData = await response.json();

                let loadedContent = '';

                // Get all chunk keys and load them in order
                const chunkKeys = Object.keys(chunksData).sort((a, b) => {
                    const numA = parseInt(a.split('-')[1]);
                    const numB = parseInt(b.split('-')[1]);
                    return numA - numB;
                });

                // Reassemble chunks from JSON entries
                // JSON automatically unescapes the content, so no additional processing needed
                for (let i = 0; i < chunkKeys.length; i++) {
                    loadedContent += chunksData[chunkKeys[i]];

                    const percent = Math.round(((i + 1) / chunkKeys.length) * 100);
                    document.getElementById('percent').textContent = percent;
                }

                // Hide loader and show game
                document.getElementById('loader').style.display = 'none';

                // Create iframe with the complete content
                const blob = new Blob([loadedContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                const iframe = document.createElement('iframe');
                iframe.src = blobUrl;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.margin = '0';
                iframe.style.padding = '0';

                document.getElementById('game-container').appendChild(iframe);
            } catch (error) {
                document.getElementById('loader').innerHTML = '<div style="color: red;">Error loading game: ' + error.message + '</div>';
                console.error('Error:', error);
            }
        }

        loadGame();
    </script>
</body>

</html>
