    <title>Verus Blaster - Self-Contained</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        #loader {
            text-align: center;
        }

        #progress {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            color: #ff6666;
            margin-top: 20px;
        }
    </style>
</head>

        const progress = document.getElementById('progress');
        const errorDiv = document.getElementById('error');

        function updateProgress(message) {
            progress.textContent = message;
            console.log(message);
        }

        function showError(message) {
            errorDiv.textContent = '❌ Error: ' + message;
            console.error(message);
        }

        async function decodeAndDecompress(base64Data) {
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            if (typeof DecompressionStream === 'undefined') {
                throw new Error('Brotli requires DecompressionStream support in this browser.');
            }

            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('brotli'));
            const decompressedBuffer = await new Response(stream).arrayBuffer();
            return new Uint8Array(decompressedBuffer);
        }

        async function loadGame() {
            try {
                if (COMPRESSED_GAME_DATA === "{{COMPRESSED_DATA}}") {
                    showError('Game data not embedded. Run build-embedded.js to create the final file.');
                    return;
                }

                updateProgress('Decoding base64...');

                updateProgress('Decompressing game...');

                const decompressed = await decodeAndDecompress(COMPRESSED_GAME_DATA);
                const gameHTML = new TextDecoder().decode(decompressed);

                updateProgress('Launching game...');

                // Inject the game
                document.open();
                document.write(gameHTML);
                document.close();

            } catch (error) {
                showError(error.message);
                console.error('Full error:', error);
            }
        }

        // Start loading
        window.addEventListener('DOMContentLoaded', () => {
            loadGame();
        });
    </script>
